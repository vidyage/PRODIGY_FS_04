<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Real-Time Chat Application</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- AUTH SECTION -->

    <section id="authSection" class="auth-container">

        <div class="auth-card">

            <div class="logo">
                💬
            </div>

            <h1>Real-Time Chat</h1>

            <p class="subtitle">
                Connect. Chat. Share.
            </p>

            <!-- LOGIN -->

            <form id="loginForm">

                <h2>Welcome Back</h2>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p>
                    Don't have an account?
                    <button
                        type="button"
                        class="link-button"
                        id="showRegister"
                    >
                        Register
                    </button>
                </p>

            </form>

            <!-- REGISTER -->

            <form
                id="registerForm"
                class="hidden"
            >

                <h2>Create Account</h2>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Username"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

                <p>
                    Already have an account?
                    <button
                        type="button"
                        class="link-button"
                        id="showLogin"
                    >
                        Login
                    </button>
                </p>

            </form>

            <p
                id="authMessage"
                class="message"
            ></p>

        </div>

    </section>


    <!-- CHAT APPLICATION -->

    <section
        id="chatSection"
        class="chat-section hidden"
    >

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <div>
                    <h2>💬 ChatApp</h2>

                    <p id="currentUser">
                        User
                    </p>
                </div>

                <button
                    id="logoutButton"
                    class="logout"
                >
                    Logout
                </button>

            </div>


            <!-- ROOMS -->

            <div class="sidebar-title">

                <span>Chat Rooms</span>

                <button id="createRoomButton">
                    +
                </button>

            </div>

            <div id="roomList">
            </div>


            <!-- USERS -->

            <div class="sidebar-title">
                <span>Private Chats</span>
            </div>

            <div id="userList">
            </div>

        </aside>


        <!-- CHAT AREA -->

        <main class="chat-area">

            <header class="chat-header">

                <div>

                    <h2 id="chatTitle">
                        Select a chat
                    </h2>

                    <p id="chatStatus">
                        Choose a room or user
                    </p>

                </div>

                <div
                    id="onlineIndicator"
                    class="online-indicator"
                >
                    ● Online
                </div>

            </header>


            <!-- MESSAGES -->

            <div
                id="messages"
                class="messages"
            >

                <div class="welcome-message">

                    <div class="welcome-icon">
                        💬
                    </div>

                    <h2>
                        Welcome to Real-Time Chat
                    </h2>

                    <p>
                        Select a room or private user
                        to start chatting.
                    </p>

                </div>

            </div>


            <!-- TYPING AREA -->

            <form
                id="messageForm"
                class="message-form"
            >

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    autocomplete="off"
                    disabled
                >

                <button
                    type="submit"
                    id="sendButton"
                    disabled
                >
                    Send
                </button>

            </form>

        </main>

    </section>


    <div
        id="notification"
        class="notification"
    ></div>


    <script src="/socket.io/socket.io.js"></script>

    <script src="script.js"></script>

</body>

</html>
